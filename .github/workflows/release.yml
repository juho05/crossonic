name: Release Draft

on:
  workflow_dispatch:
    inputs:
      upload_app_store:
        description: "Upload the iOS build to App Store Connect"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.5"
  APK_BUILD_DIR: "/tmp/build"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.get_version.outputs.version }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if ! IS_DRAFT=$(gh release view "$TAG" --json isDraft -q .isDraft 2>&1); then
            if [ "$IS_DRAFT" != "release not found" ]; then
              echo "::error::Failed to look up $TAG: $IS_DRAFT"
              exit 1
            fi
            IS_DRAFT=""
          fi
          if [ "$IS_DRAFT" = "false" ]; then
            echo "::error::$TAG is already published, bump the version in pubspec.yaml"
            exit 1
          elif [ "$IS_DRAFT" = "true" ]; then
            gh release edit "$TAG" --target "$GITHUB_SHA"
          else
            PREVIOUS_TAG=$(gh release view --json tagName -q .tagName)
            sed -e "s|{{VERSION}}|$VERSION|g" \
              -e "s|{{PREVIOUS_TAG}}|$PREVIOUS_TAG|g" \
              -e "s|{{REPOSITORY}}|$GITHUB_REPOSITORY|g" \
              .github/release-template.md > notes.md
            gh release create "$TAG" --draft --title "$TAG" --target "$GITHUB_SHA" --notes-file notes.md
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/flutter-setup

      - name: Run tests
        run: flutter test

  build_android:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Copy files to env.APK_BUILD_DIR
        run: |
          mkdir -p $APK_BUILD_DIR
          cp -r . $APK_BUILD_DIR

      - name: Decode key.properties file
        working-directory: ${{ env.APK_BUILD_DIR }}
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: echo $ENCODED_STRING | base64 -di > android/key.properties

      - name: Decode crossonic.jks file
        working-directory: ${{ env.APK_BUILD_DIR }}
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEY_STORE }}
        run: mkdir android/app/secrets && echo $ENCODED_STRING | base64 -di > android/app/secrets/crossonic.jks

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: ./.github/actions/flutter-setup
        with:
          working-directory: ${{ env.APK_BUILD_DIR }}

      - name: Build APK
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: flutter build apk --split-per-abi

      - name: Verify APK signature
        working-directory: ${{ env.APK_BUILD_DIR }}
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail

          if [ -z "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::ANDROID_SIGNING_CERT_SHA256 variable is not set"
            exit 1
          fi
          EXPECTED=$(echo "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          echo "Expected signing certificate SHA-256: $EXPECTED"

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          APKSIGNER="$BUILD_TOOLS/apksigner"

          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "::group::Verifying $apk"
            "$APKSIGNER" verify --verbose "$apk"
            ACTUAL=$("$APKSIGNER" verify --print-certs "$apk" \
              | grep -i 'SHA-256 digest' | head -n1 | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')
            echo "Signer certificate SHA-256: $ACTUAL"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::$apk is not signed with the expected certificate"
              exit 1
            fi
            echo "$apk is signed with the correct certificate"
            echo "::endgroup::"
          done

      - name: Prepare AndroidManifest.xml for Play Store
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: |
          sed -i '/REQUEST_INSTALL_PACKAGES/d' ./android/app/src/main/AndroidManifest.xml
          sed -i '/REQUEST_IGNORE_BATTERY_OPTIMIZATIONS/d' ./android/app/src/main/AndroidManifest.xml

      - name: Build App Bundle
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: flutter build appbundle --dart-define=VERSION_CHECK=false --dart-define=PLAYSTORE=true

      - name: Verify App Bundle signature
        working-directory: ${{ env.APK_BUILD_DIR }}
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail

          if [ -z "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::ANDROID_SIGNING_CERT_SHA256 variable is not set"
            exit 1
          fi
          EXPECTED=$(echo "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          echo "Expected signing certificate SHA-256: $EXPECTED"

          AAB=build/app/outputs/bundle/release/app-release.aab
          echo "Verifying $AAB"
          jarsigner -verify "$AAB"
          ACTUAL=$(keytool -printcert -jarfile "$AAB" \
            | grep -i 'SHA256:' | head -n1 | awk '{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "Signer certificate SHA-256: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::$AAB is not signed with the expected certificate"
            exit 1
          fi
          echo "$AAB is signed with the correct certificate"

      - name: Upload App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: android-aab-result
          path: |
            ${{ env.APK_BUILD_DIR }}/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-result
          path: |
            ${{ env.APK_BUILD_DIR }}/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            ${{ env.APK_BUILD_DIR }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            ${{ env.APK_BUILD_DIR }}/build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 2
  build_libmpv_linux_x86_64:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Restore libmpv from cache
        id: cache
        uses: actions/cache@v6
        with:
          path: libmpv
          key: libmpv-linux-x86-64-ubuntu-22.04-${{ hashFiles('scripts/libmpv/build.sh', 'scripts/libmpv/apt-packages.txt') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          xargs sudo apt-get install -y < scripts/libmpv/apt-packages.txt

      - name: Build libmpv
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/libmpv/build.sh libmpv

      - name: Upload libmpv
        uses: actions/upload-artifact@v7
        with:
          name: libmpv-linux-x86-64
          path: libmpv
          retention-days: 2
  build_linux_x86_64_AppImage:
    needs:
      - build
      - build_libmpv_linux_x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get remove libunwind-*
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build
          sudo apt-get install -y appstream desktop-file-utils zsync

      - uses: ./.github/actions/flutter-setup

      - name: Compile linux
        run: flutter build linux

      - name: Download libmpv
        uses: actions/download-artifact@v8
        with:
          name: libmpv-linux-x86-64
          path: libmpv

      - name: Build AppImage
        run: |
          scripts/appimage/build.sh "${{ needs.build.outputs.version }}" libmpv \
            "gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|Crossonic-*-linux-x86-64.AppImage.zsync"

      - name: Check AppImage dependencies
        run: scripts/appimage/check-deps.sh "Crossonic-${{ needs.build.outputs.version }}-linux-x86-64.AppImage"

      - name: Upload AppImage file
        uses: actions/upload-artifact@v7
        with:
          name: appimage-x86-64-result
          path: |
            ./*.AppImage
            ./*.AppImage.zsync
          retention-days: 2
  build_linux_x86_64_TGZ:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get remove libunwind-*
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libmpv-dev libmpv2

      - uses: ./.github/actions/flutter-setup

      - name: Compile linux
        run: flutter build linux

      # tar.gz
      - name: Create tar.gz archive
        run: |
          cd build/linux/x64/release/bundle
          tar -czvf ../../../../../result.tar.gz *

      - name: Upload tar.gz archive
        uses: actions/upload-artifact@v7
        with:
          name: tar-gz-x86-64-result
          path: ./*.tar.gz
          retention-days: 2

  build_windows_x86_64:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/flutter-setup

      - name: Compile for Windows
        run: flutter build windows

      - name: Build installer
        run: dart run inno_bundle --no-app --release

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-x86-64-result
          path: ./build/windows/x64/installer/Release/*-Installer.exe
          if-no-files-found: error
          retention-days: 2

      - name: Add DLL files
        run: |
          Copy-Item scripts/windows/x64/msvcp140.dll build/windows/x64/runner/Release/
          Copy-Item scripts/windows/x64/vcruntime140.dll build/windows/x64/runner/Release/
          Copy-Item scripts/windows/x64/vcruntime140_1.dll build/windows/x64/runner/Release/

      - name: Zip compiled files
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Crossonic.zip

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: windows-zip-x86-64-result
          path: Crossonic.zip
          retention-days: 2
  build_macos_dmg:
    needs: build
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/flutter-setup

      - name: Compile for macOS
        run: flutter build macos

      - name: Codesign app bundle
        env:
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
        run: |
          APP_PATH="build/macos/Build/Products/Release/Crossonic.app"
          
          echo $MACOS_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain 
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          
          # Function to recursively sign all binaries
          sign_binaries() {
            local path=$1
          
            # Sign all .dylib files
            find "$path" -name "*.dylib" -type f | while read dylib; do
              echo "Signing dylib: $dylib"
              codesign --force --timestamp \
                --options=runtime \
                --entitlements ./macos/Runner/Release.entitlements \
                --sign "$MACOS_CERTIFICATE_NAME" \
                "$dylib"
            done
          
            # Sign all .so files (if any)
            find "$path" -name "*.so" -type f | while read so_file; do
              echo "Signing .so: $so_file"
              codesign --force --timestamp \
                --options=runtime \
                --entitlements ./macos/Runner/Release.entitlements \
                --sign "$MACOS_CERTIFICATE_NAME" \
                "$so_file"
            done
          }
          
          # Sign frameworks first (innermost first)
          echo "Signing frameworks..."
          find "$APP_PATH/Contents/Frameworks" -depth -name "*.framework" -type d | while read framework; do
            echo "Signing framework: $framework"
          
            # Sign binaries inside framework
            sign_binaries "$framework"
          
            # Sign the framework itself
            codesign --force --timestamp \
              --options=runtime \
              --entitlements ./macos/Runner/Release.entitlements \
              --sign "$MACOS_CERTIFICATE_NAME" \
              "$framework"
          done
          
          # Sign all binaries in the main app
          sign_binaries "$APP_PATH"
          
          # Finally, sign the main app bundle (last)
          echo "Signing main app bundle..."
          codesign --force --timestamp \
            --options=runtime \
            --entitlements ./macos/Runner/Release.entitlements \
            --sign "$MACOS_CERTIFICATE_NAME" \
            "$APP_PATH"
          
          # Verify signature
          echo "Verifying signature..."
          codesign --verify --verbose "$APP_PATH"

      - name: "Notarize app bundle"
        working-directory: build/macos/Build/Products/Release
        env:
          PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.APPLE_ID }}
          PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.APPLE_ID_PWD }}
        run: |
          echo "Create keychain profile"
          xcrun notarytool store-credentials "notarytool-profile" --apple-id "$PROD_MACOS_NOTARIZATION_APPLE_ID" --team-id "$PROD_MACOS_NOTARIZATION_TEAM_ID" --password "$PROD_MACOS_NOTARIZATION_PWD"
          
          echo "Creating temp notarization archive"
          ditto -c -k --keepParent Crossonic.app "notarization.zip"

          echo "Notarize app"
          xcrun notarytool submit "notarization.zip" --keychain-profile "notarytool-profile" --wait

          echo "Attach staple"
          xcrun stapler staple Crossonic.app

      - name: Verify code signature
        env:
          EXPECTED_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP_PATH="build/macos/Build/Products/Release/Crossonic.app"

          echo "Verifying code signature integrity..."
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          echo "Checking signing certificate..."
          if [ -z "$EXPECTED_TEAM_ID" ]; then
            echo "::error::APPLE_TEAM_ID variable is not set"
            exit 1
          fi
          INFO=$(codesign -dvv "$APP_PATH" 2>&1)
          AUTHORITY=$(echo "$INFO" | grep '^Authority=' | head -n1 | cut -d= -f2-)
          TEAM_ID=$(echo "$INFO" | grep '^TeamIdentifier=' | cut -d= -f2-)
          echo "Signing authority: $AUTHORITY"
          echo "Team identifier: $TEAM_ID"
          case "$AUTHORITY" in
            "Developer ID Application: "*) echo "Signed with a Developer ID Application certificate" ;;
            *) echo "::error::App bundle not signed with a Developer ID Application certificate: $AUTHORITY"; exit 1 ;;
          esac
          if [ "$TEAM_ID" != "$EXPECTED_TEAM_ID" ]; then
            echo "::error::App bundle signed with unexpected team ID: $TEAM_ID (expected $EXPECTED_TEAM_ID)"
            exit 1
          fi

          echo "Verifying notarization via Gatekeeper..."
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Create .dmg file
        run: |
          npm install -g appdmg
          cd scripts/dmg
          appdmg config.json ../../Crossonic.dmg

      - name: Sign and notarize .dmg file
        env:
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
        run: |
          codesign --force --timestamp --sign "$MACOS_CERTIFICATE_NAME" Crossonic.dmg
          xcrun notarytool submit Crossonic.dmg --keychain-profile "notarytool-profile" --wait
          xcrun stapler staple Crossonic.dmg
          spctl -a -t open --context context:primary-signature -vv Crossonic.dmg

      - name: Clean up keychain
        if: ${{ always() }}
        run: |
          security delete-keychain build.keychain

      - name: Upload .dmg file
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg-result
          path: Crossonic.dmg
          retention-days: 2
  build_ios_ipa:
    needs: build
    runs-on: macos-26
    timeout-minutes: 20
    # disable unused permissions -> also change xcode pre-action env variables and the "Check Plugin Permission Env" build phase when changing these
    env:
      # permission_handler
      PERMISSION_NOTIFICATIONS: "0"
      # background_downloader
      BYPASS_PERMISSION_NOTIFICATIONS: "1"
      BYPASS_PERMISSION_IOSADDTOPHOTOLIBRARY: "1"
      BYPASS_PERMISSION_IOSCHANGEPHOTOLIBRARY: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Apple certification and provisioning profile
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PWD: ${{ secrets.IOS_CERTIFICATE_PWD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_CI_KEYCHAIN_PWD: ${{ secrets.IOS_CI_KEYCHAIN_PWD }}
        run: |
          # import certificate and provisioning profile from secrets
          echo -n "$IOS_CERTIFICATE" | base64 --decode > build_certificate.p12
          echo -n "$IOS_PROVISIONING_PROFILE" | base64 --decode > ./build_pp.mobileprovision
          # create temporary keychain
          security create-keychain -p "$IOS_CI_KEYCHAIN_PWD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$IOS_CI_KEYCHAIN_PWD" build.keychain
          # import certificate to keychain
          security import build_certificate.p12 -P "$IOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$IOS_CI_KEYCHAIN_PWD" build.keychain
          security list-keychain -d user -s build.keychain
          # apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp build_pp.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles

      - uses: ./.github/actions/flutter-setup

      - name: Compile for iOS
        run: flutter build ipa --dart-define=VERSION_CHECK=false --export-options-plist=./ios/Runner/ExportOptions.plist
      - name: Move .ipa to working directory
        run: mv build/ios/ipa/crossonic.ipa ./Crossonic.ipa

      - name: Verify IPA signature
        env:
          EXPECTED_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          EXPECTED_CERT=$(/usr/libexec/PlistBuddy -c "Print :signingCertificate" ios/Runner/ExportOptions.plist)
          echo "Expected team ID: $EXPECTED_TEAM_ID"
          echo "Expected certificate: $EXPECTED_CERT"
          if [ -z "$EXPECTED_TEAM_ID" ]; then
            echo "::error::APPLE_TEAM_ID variable is not set"
            exit 1
          fi
          if [ -z "$EXPECTED_CERT" ]; then
            echo "::error::signingCertificate is not set in ios/Runner/ExportOptions.plist"
            exit 1
          fi

          rm -rf ipa_verify
          unzip -q Crossonic.ipa -d ipa_verify
          APP_PATH=$(ls -d ipa_verify/Payload/*.app | head -n1)

          echo "Verifying code signature integrity..."
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          INFO=$(codesign -dvv "$APP_PATH" 2>&1)
          echo "$INFO"
          TEAM_ID=$(echo "$INFO" | grep '^TeamIdentifier=' | cut -d= -f2-)
          AUTHORITY=$(echo "$INFO" | grep '^Authority=' | head -n1 | cut -d= -f2-)

          if [ -z "$AUTHORITY" ]; then
            echo "::error::IPA has no signing authority (not signed)"
            exit 1
          fi
          if [ "$TEAM_ID" != "$EXPECTED_TEAM_ID" ]; then
            echo "::error::IPA signed with unexpected team ID: $TEAM_ID (expected $EXPECTED_TEAM_ID)"
            exit 1
          fi
          case "$AUTHORITY" in
            "$EXPECTED_CERT"*) echo "IPA signed with the correct certificate: $AUTHORITY" ;;
            *) echo "::error::IPA signed with unexpected certificate: $AUTHORITY (expected $EXPECTED_CERT)"; exit 1 ;;
          esac

      - name: Clean up keychain and provisioning profile
        if: ${{ always() }}
        run: |
          security delete-keychain build.keychain
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision

      - name: Upload .ipa file
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa-result
          path: Crossonic.ipa
          retention-days: 2
  build_web_zip:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/flutter-setup

      - name: Compile for web
        run: flutter build web --wasm

      - name: Create .zip archive
        run: |
          cd build/web
          zip -r ../../crossonic.zip .

      - name: Upload .zip file
        uses: actions/upload-artifact@v7
        with:
          name: web-zip-result
          path: crossonic.zip
          retention-days: 2
  release:
    needs:
      - build
      - test
      - build_android
      - build_linux_x86_64_TGZ
      - build_linux_x86_64_AppImage
      - build_windows_x86_64
      - build_macos_dmg
      - build_ios_ipa
      - build_web_zip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Create uploads directory
        run: mkdir uploads

      # Android
      - name: Download Android files
        uses: actions/download-artifact@v8
        with:
          name: android-apk-result
          path: android-apk-result

      - name: Copy APKs to uploads
        run: |
          cp android-apk-result/app-armeabi-v7a-release.apk uploads/Crossonic-${{ needs.build.outputs.version }}-android-arm32v7.apk
          cp android-apk-result/app-arm64-v8a-release.apk uploads/Crossonic-${{ needs.build.outputs.version }}-android-arm64v8.apk
          cp android-apk-result/app-x86_64-release.apk uploads/Crossonic-${{ needs.build.outputs.version }}-android-x64.apk

      # TAR.GZ (x86_64)
      - name: Download tar.gz file
        uses: actions/download-artifact@v8
        with:
          name: tar-gz-x86-64-result
          path: tar-gz-x86-64-result

      - name: Copy tar.gz file to uploads
        run: |
          cp tar-gz-x86-64-result/* uploads/Crossonic-${{ needs.build.outputs.version }}-linux-x86-64.tar.gz

      # APPIMAGE (x86_64)
      - name: Download AppImage file
        uses: actions/download-artifact@v8
        with:
          name: appimage-x86-64-result
          path: appimage-x86-64-result

      - name: Copy AppImage files to uploads
        run: |
          cp appimage-x86-64-result/Crossonic-${{ needs.build.outputs.version }}-linux-x86-64.AppImage uploads/
          cp appimage-x86-64-result/Crossonic-${{ needs.build.outputs.version }}-linux-x86-64.AppImage.zsync uploads/

      # WINDOWS ZIP (x86_64)
      - name: Download windows zip file
        uses: actions/download-artifact@v8
        with:
          name: windows-zip-x86-64-result
          path: windows-zip-x86-64-result

      - name: Copy zip file to uploads
        run: cp windows-zip-x86-64-result/*.zip uploads/Crossonic-${{ needs.build.outputs.version }}-windows-x86-64.zip

      # WINDOWS Installer (x86_64)
      - name: Download windows installer file
        uses: actions/download-artifact@v8
        with:
          name: windows-installer-x86-64-result
          path: windows-installer-x86-64-result

      - name: Copy installer file to uploads
        run: cp windows-installer-x86-64-result/*-Installer.exe uploads/Crossonic-${{ needs.build.outputs.version }}-windows-x86-64.exe

      # macOS .dmg (universal)
      - name: Download macOS .dmg file
        uses: actions/download-artifact@v8
        with:
          name: macos-dmg-result
          path: macos-dmg-result

      - name: Copy .dmg file to uploads
        run: cp macos-dmg-result/Crossonic.dmg uploads/Crossonic-${{ needs.build.outputs.version }}-macOS-universal.dmg

      # web
      - name: Download web .zip file
        uses: actions/download-artifact@v8
        with:
          name: web-zip-result
          path: web-zip-result

      - name: Copy .zip file to uploads
        run: cp web-zip-result/crossonic.zip uploads/Crossonic-${{ needs.build.outputs.version }}-web.zip

      - name: Generate checksums
        working-directory: uploads
        run: sha256sum Crossonic-* > Crossonic-${{ needs.build.outputs.version }}-SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: uploads/Crossonic-*

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.build.outputs.version }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for f in \
            android-arm64v8.apk \
            android-arm32v7.apk \
            android-x64.apk \
            linux-x86-64.AppImage \
            linux-x86-64.AppImage.zsync \
            linux-x86-64.tar.gz \
            windows-x86-64.exe \
            windows-x86-64.zip \
            macOS-universal.dmg \
            web.zip \
            SHA256SUMS.txt
          do
            gh release upload "$TAG" "uploads/Crossonic-$VERSION-$f" --clobber
          done

  upload_app_store:
    needs:
      - build
      - release
    if: inputs.upload_app_store
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Download iOS .ipa file
        uses: actions/download-artifact@v8
        with:
          name: ios-ipa-result
          path: ios-ipa-result

      - name: Upload .ipa file to App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASS: ${{ secrets.APPLE_ID_PWD }}
        run: xcrun altool --upload-app -f ios-ipa-result/Crossonic.ipa -t ios -u "$APPLE_ID" -p "$APPLE_APP_PASS"
