name: crossonic
description: "An OpenSubsonic compatible music player with its own server for additional features."
publish_to: "none"
version: 0.5.1+14
environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  auto_route: ^11.1.0
  flutter_secure_storage: ^11.0.0
  crypto: ^3.0.7
  http: ^1.6.0
  flutter_form_builder: ^11.0.0
  form_builder_validators: ^11.3.0
  json_annotation: ^4.12.0
  rxdart: ^0.28.0
  audio_session: ^0.2.3
  # 1.1.0 won't build
  smtc_windows: 1.0.0
  audio_service:
    git:
      url: https://github.com/juho05/audio_service
      ref: 4d8abf4
      path: audio_service
  optimize_battery:
    git: https://github.com/juho05/optimize_battery
  audio_service_mpris: ^0.2.1
  audio_video_progress_bar: ^2.0.3
  sliding_up_panel: ^2.0.0+1
  icon_decoration: ^2.1.0
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  path_provider: ^2.1.6
  flutter_cache_manager: ^3.4.1
  connectivity_plus: ^7.2.0
  file: ^7.0.1
  intl: ^0.20.2
  background_downloader: ^9.5.5
  path: ^1.9.1
  image_picker: ^1.2.2
  flutter_single_instance: ^1.7.0
  window_manager: ^0.5.1
  tray_manager: ^0.5.3
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.0
  dbus: ^0.7.14
  dbus_secrets: ^0.0.2
  cryptography_plus: ^3.0.0
  xdg_directories: ^1.1.0
  collection: ^1.19.1
  logger: ^2.7.0
  share_plus: ^13.2.0
  device_info_plus: ^13.2.0
  android_package_installer: ^0.0.3
  permission_handler: ^13.0.0
  open_file: ^4.0.0
  image: ^4.5.4
  flutter_displaymode: ^0.7.0
  wakelock_plus: ^1.4.0
  super_sliver_list: ^0.4.1
  month_picker_dialog: ^6.7.2
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  dynamic_color: ^2.1.0
  file_selector: ^1.1.0
  file_picker: ^13.1.0
  uuid: ^4.5.3
  xml: ^6.6.1
  bonsoir: ^7.1.4
  predictive_transition:
    git:
      url: https://github.com/juho05/flutter_predictive_transition
      ref: 1c52b52ff1a257d263295d3ed612d465c42c7813

  material_ui: ^1.5.0
  cupertino_ui: ^1.1.1
dependency_overrides:
  auto_route:
    git:
      url: https://github.com/juho05/auto_route_library
      ref: 284a1f4b19101e098779a7ad8373e3db450fb2d8
      path: ./auto_route
  auto_route_generator:
    git:
      url: https://github.com/juho05/auto_route_library
      ref: 284a1f4b19101e098779a7ad8373e3db450fb2d8
      path: ./auto_route_generator
  flutter_secure_storage_linux:
    path: ./dependency_overrides/stubs/flutter_secure_storage_linux
  path_provider_linux:
    path: ./dependency_overrides/path_provider_linux
  media_kit_libs_android_audio:
    path: ./dependency_overrides/stubs/media_kit_libs_android_audio
  permission_handler_windows:
    path: ./dependency_overrides/stubs/permission_handler_windows
  audio_service_mpris:
    path: ./dependency_overrides/audio_service_mpris
dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  auto_route_generator: ^10.4.0
  build_runner: ^2.9.0
  json_serializable: ^6.11.1
  drift_dev: ^2.32.0
  inno_bundle: ^0.11.0
  wakelock_plus_platform_interface: ^1.5.1
flutter:
  uses-material-design: true
  assets:
    - assets/icon/crossonic-tray.png
    - assets/icon/crossonic-tray.ico
    - assets/icon/crossonic-foreground-monochrome.svg
    - assets/icon/desktop/crossonic-512.png
    - assets/fonts/Roboto_LICENSE.txt
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Roboto-Black.ttf
          weight: 900
        - asset: assets/fonts/Roboto-BlackItalic.ttf
          weight: 900
          style: italic
inno_bundle:
  id: cbe0f7d0-37fc-11f0-a197-6529278abc9e
  name: Crossonic
  description: OpenSubsonic compatible music player
  publisher: juho05
  url: "https://crossonic.org/app"
  updates_url: "https://github.com/juho05/crossonic/releases/latest"
  admin: auto
  vc_redist: true
  languages:
    - english
